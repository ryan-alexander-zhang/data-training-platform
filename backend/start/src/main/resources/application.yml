spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/training_platform}
    username: ${SPRING_DATASOURCE_USERNAME:training}
    password: ${SPRING_DATASOURCE_PASSWORD:training}
  flyway:
    validate-on-migrate: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${SPRING_KAFKA_GROUP_ID:training-platform}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.training.domain

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

training:
  events:
    topic: ${TRAINING_EVENTS_TOPIC:training.events}
  label-studio:
    base-url: ${LABEL_STUDIO_BASE_URL:http://localhost:8080}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minio}
      secret-key: ${MINIO_SECRET_KEY:minio123}
      bucket: ${MINIO_BUCKET:training-data}
