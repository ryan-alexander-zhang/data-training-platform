spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/training_platform}
    username: ${SPRING_DATASOURCE_USERNAME:training}
    password: ${SPRING_DATASOURCE_PASSWORD:training}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  type-handlers-package: com.example.training.infra.mybatis

training:
  events:
    topic: ${TRAINING_EVENTS_TOPIC:training.events}
